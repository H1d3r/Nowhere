name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cross
        uses: taiki-e/install-action@cross
      - if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}
      - if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - if: matrix.archive == 'tar'
        shell: bash
        run: tar -czf "nowhere-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" nowhere
      - if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive "target/${{ matrix.target }}/release/nowhere.exe" "nowhere-${{ matrix.target }}.zip"
      - uses: softprops/action-gh-release@v3.0.2
        with:
          files: nowhere-${{ matrix.target }}.*
